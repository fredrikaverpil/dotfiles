# Output layout, the twin of ../niri/outputs.kdl, kept by hand. Keyed by
# make/model/serial so it follows the monitor across ports. Positions are
# logical pixels with the laptop panel at the origin; sections for disconnected
# monitors are ignored. Names are `Config name` in `umbriel outputs`.

[output.eDP-1]
scale = 1.0
position = [0, 0]

# TV at work.
# Above, centered.
[output."LG Electronics LG SIGNAGE 0x01010101"]
scale = 1.2
position = [-640, -1800]

# Work monitor.
# Right, bottoms aligned.
[output."Dell Inc. DELL P3221D GN2ZQ83"]
scale = 1.0
position = [1920, -240]

# Home 4k monitor.
# Left, tops aligned.
[output."Dell Inc. DELL U2723QE 13B95P3"]
scale = 1.0
position = [-3840, 0]
