# GPU decoding where the Renoir iGPU supports the codec (H.264, HEVC 4:2:0,
# VP9). HEVC 4:2:2 10-bit (Rext) camera footage is unsupported and falls back
# to software decoding, which the CPU handles in real time.
hwdec=auto-safe

# Bilinear scaling, no dithering. Default gpu-next rendering of 4K 10-bit
# frames on the iGPU, alongside software decoding, drops ~40% of frames on
# 4K30 HEVC 4:2:2 footage; this drops none.
profile=fast
