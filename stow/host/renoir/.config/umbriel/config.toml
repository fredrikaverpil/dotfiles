# The twin of ../niri/config.kdl's includes. umbriel applies a file's includes
# in list order, optional ones last, and then the file itself, so this file
# holds only includes and the shared settings are in common.toml. kaizen.toml
# is what the kaizen shell needs, from kaizen/stow; its binds lead the menu's
# Keybindings list. host.toml is applied last, so its binds win.
[include]
files = ["outputs.toml", "kaizen.toml", "common.toml"]

[include.optional]
files = ["host.toml"]
