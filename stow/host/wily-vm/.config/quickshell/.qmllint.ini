# Read by both qmllint and qmlls, so the editor and the command line agree on
# what counts as a finding. Only the suppressions are listed; every other
# category keeps its default.
#
# All four are Quickshell type-export gaps or idioms this tree uses on purpose,
# not defects here:
#   UnqualifiedAccess          IDs reached from nested Components (155 hits)
#   UncreatableType            PanelWindow, which only Quickshell instantiates
#   UnresolvedType             AuthFlow and friends, not exposed declaratively
#   BadSignalHandlerParameters QProcess::ExitStatus in onExited
[Warnings]
UnqualifiedAccess=disable
UncreatableType=disable
UnresolvedType=disable
BadSignalHandlerParameters=disable
