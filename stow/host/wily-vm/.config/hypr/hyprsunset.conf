# Keeps hyprsunset inert at startup: without a profile it applies a tint of
# its own. Omarchy ships exactly this, and the schedule deliberately does not
# live here -- hyprsunset only understands fixed clock times, so sunrise and
# sunset are computed in the Quickshell nightlight service, which re-asserts
# the temperature every minute and so heals this profile's morning clobber.
profile {
    time = 07:00
    identity = true
}
