# Settings for a project's mise.toml, which overrides tools of the shared
# toolchain (nix/shared/toolchain.nix). No tools are installed globally.

[settings]
activate_shims = false # keeps shims off the shell PATH; the wrappers add them
all_compile = false    # precompiled builds only (NixOS defaults to compiling)

[settings.python]
uv_venv_auto = "source" # activate a uv project's .venv

# go finds its root from its binary; a GOROOT breaks the devshell's go.
[settings.go]
set_goroot = false
