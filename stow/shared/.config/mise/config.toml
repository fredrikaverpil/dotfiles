# The shared development toolchain, over what stays in Nix
# (nix/shared/toolchain.nix). Neovim, the `claude` wrapper and the `dev`
# devshell put mise's shims ahead of Nix's: a project's mise.toml shadows a tool
# here, and a tool nothing here declares falls through to Nix.
# Pin or update one tool with `mise use -g <tool>@<version>`; mise.lock locks
# it for every platform. Run `mise install` after a change.

[settings]
lockfile = true
# mise defaults to true on NixOS; nix-ld runs the precompiled binaries.
all_compile = false

# Precompiled only: fail rather than fall back to a slow source build.
[settings.node]
compile = false

[settings.python]
compile = false

[settings.ruby]
compile = false

[tools]
go = "latest"
node = "lts"           # npm for Mason packages (macOS), grammar.js for tree-sitter generate
python = "latest"
ruby = "latest"
tree-sitter = "latest"

# LSPs/linters/formatters, mirroring Mason's `ensure_installed`
# (stow/shared/.config/nvim-fredrik/plugin/mason.lua). Mason is disabled on
# NixOS and appends to PATH on macOS, so these come first. Keep the two lists
# in sync. Kept alphabetical by Mason name; the trailing comment is the
# language/tool. Not mirrored: codelldb/debugpy (no DAP adapter uses them),
# rust-analyzer (rustup component), elixir-ls and nil (Nix on NixOS, Mason on
# macOS).
actionlint = "latest"                                              # yaml (github actions)
"go:github.com/googleapis/api-linter/v2/cmd/api-linter" = "latest" # protobuf
"npm:basedpyright" = "latest"                                      # python
"npm:bash-language-server" = "latest"                              # bash
biome = "latest"                                                   # json
buf = "latest"                                                     # protobuf
"go:github.com/go-delve/delve/cmd/dlv" = "latest"                  # go
"npm:dockerfile-language-server-nodejs" = "latest"                 # docker
"go:github.com/daixiang0/gci" = "latest"                           # go
gofumpt = "latest"                                                 # go (golines runs it as --base-formatter)
"go:golang.org/x/tools/cmd/goimports" = "latest"                   # go
golangci-lint = "latest"                                           # go
golines = "latest"                                                 # go
"go:golang.org/x/tools/gopls" = "latest"                           # go
gotestsum = "latest"                                               # go (neotest)
"npm:graphql-language-service-cli" = "latest"                      # graphql
hadolint = "latest"                                                # docker
"go:github.com/josharian/impl" = "latest"                          # go (go-impl.nvim)
"npm:vscode-langservers-extracted" = "latest"                      # json (json-lsp)
lua-language-server = "latest"                                     # lua
"npm:markdownlint-cli" = "latest"                                  # markdown
"pipx:mypy" = "latest"                                             # python
prettier = "latest"                                                # typescript/javascript
protolint = "latest"                                               # protobuf
ruff = "latest"                                                    # python
rumdl = "latest"                                                   # markdown
shellcheck = "latest"                                              # bash (bashls runs it itself; not a nvim-lint linter)
shfmt = "latest"                                                   # bash
stylua = "latest"                                                  # lua
superhtml = "latest"                                               # html
taplo = "latest"                                                   # toml
"github:a-h/templ" = "latest"                                      # templ
terraform-ls = "latest"                                            # terraform
tflint = "latest"                                                  # terraform
"github:ribru17/ts_query_ls" = "latest"                            # query
"npm:@vtsls/language-server" = "latest"                            # typescript
"npm:yaml-language-server" = "latest"                              # yaml
yamlfmt = "latest"                                                 # yaml
# yamllint = "latest"                                              # yaml (Nix: not yet available in mise for python 3.15)
zls = "latest" # zig
