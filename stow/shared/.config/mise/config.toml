# The shared development toolchain, over what stays in Nix
# (nix/shared/toolchain.nix). Neovim, the `claude` wrapper and the `dev`
# devshell put mise's shims ahead of Nix's: a project's mise.toml shadows a tool
# here, and a tool nothing here declares falls through to Nix.
# Pin or update one tool with `mise use -g <tool>@<version>`; mise.lock locks
# it for every platform. Run `mise install` after a change.

[settings]
lockfile = true
# mise defaults to true on NixOS; nix-ld runs the precompiled binaries.
all_compile = false

# Precompiled only: fail rather than fall back to a slow source build.
[settings.node]
compile = false

[settings.python]
compile = false

[settings.ruby]
compile = false

[tools]
go = "latest"
node = "lts" # npm for Mason packages (macOS), grammar.js for tree-sitter generate
python = "latest"
ruby = "latest"
tree-sitter = "latest"

# LSPs/linters/formatters: on macOS Mason installs them
# (stow/shared/.config/nvim-fredrik/plugin/mason.lua). On NixOS Mason is
# disabled — its prebuilt glibc binaries fail under stub-ld — so this
# Linux-only list mirrors Mason's `ensure_installed`. Keep the two lists in
# sync. Kept alphabetical by Mason name; the trailing comment is the
# language/tool. Not mirrored: codelldb/debugpy (no DAP adapter uses them),
# rust-analyzer (rustup component), elixir-ls and nil (Nix).
actionlint = { version = "latest", os = ["linux"] } # yaml (github actions)
"github:googleapis/api-linter" = { version = "latest", os = ["linux"] } # protobuf
"npm:basedpyright" = { version = "latest", os = ["linux"] } # python
"npm:bash-language-server" = { version = "latest", os = ["linux"] } # bash
biome = { version = "latest", os = ["linux"] } # json
buf = { version = "latest", os = ["linux"] } # protobuf
"go:github.com/go-delve/delve/cmd/dlv" = { version = "latest", os = ["linux"] } # go
"npm:dockerfile-language-server-nodejs" = { version = "latest", os = ["linux"] } # docker
"go:github.com/daixiang0/gci" = { version = "latest", os = ["linux"] } # go
gofumpt = { version = "latest", os = ["linux"] } # go (golines runs it as --base-formatter)
"go:golang.org/x/tools/cmd/goimports" = { version = "latest", os = ["linux"] } # go
golangci-lint = { version = "latest", os = ["linux"] } # go
golines = { version = "latest", os = ["linux"] } # go
"go:golang.org/x/tools/gopls" = { version = "latest", os = ["linux"] } # go
gotestsum = { version = "latest", os = ["linux"] } # go (neotest)
"npm:graphql-language-service-cli" = { version = "latest", os = ["linux"] } # graphql
hadolint = { version = "latest", os = ["linux"] } # docker
"go:github.com/josharian/impl" = { version = "latest", os = ["linux"] } # go (go-impl.nvim)
"npm:vscode-langservers-extracted" = { version = "latest", os = ["linux"] } # json (json-lsp)
lua-language-server = { version = "latest", os = ["linux"] } # lua
"npm:markdownlint-cli" = { version = "latest", os = ["linux"] } # markdown
"pipx:mypy" = { version = "latest", os = ["linux"] } # python
prettier = { version = "latest", os = ["linux"] } # typescript/javascript
protolint = { version = "latest", os = ["linux"] } # protobuf
ruff = { version = "latest", os = ["linux"] } # python
rumdl = { version = "latest", os = ["linux"] } # markdown
shellcheck = { version = "latest", os = ["linux"] } # bash (bashls runs it itself; not a nvim-lint linter)
shfmt = { version = "latest", os = ["linux"] } # bash
stylua = { version = "latest", os = ["linux"] } # lua
superhtml = { version = "latest", os = ["linux"] } # html
taplo = { version = "latest", os = ["linux"] } # toml
"github:a-h/templ" = { version = "latest", os = ["linux"] } # templ
terraform-ls = { version = "latest", os = ["linux"] } # terraform
tflint = { version = "latest", os = ["linux"] } # terraform
"github:ribru17/ts_query_ls" = { version = "latest", os = ["linux"] } # query
"npm:@vtsls/language-server" = { version = "latest", os = ["linux"] } # typescript
"npm:yaml-language-server" = { version = "latest", os = ["linux"] } # yaml
yamlfmt = { version = "latest", os = ["linux"] } # yaml
yamllint = { version = "latest", os = ["linux"] } # yaml
zls = { version = "latest", os = ["linux"] } # zig
